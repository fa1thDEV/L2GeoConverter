name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      # Fatal errors only: syntax errors and undefined names.
      - run: ruff check --select E9,F63,F7,F82 --output-format github .

  test-fast:
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements-dev.txt
      - name: Tests (without slow, GUI under Xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m pytest -m "not slow" -q
      - name: Tests (without slow)
        if: runner.os != 'Linux'
        run: python -m pytest -m "not slow" -q

  test-full:
    needs: test-fast
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: Full suite (including slow)
        run: xvfb-run -a python -m pytest -q --durations=10
